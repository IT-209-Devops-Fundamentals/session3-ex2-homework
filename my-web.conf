server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/my-web/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cấu hình trang lỗi tùy biến 404
    error_page 404 /404.html;

    # Bảo vệ tệp tin lỗi với chỉ thị internal
    # Ngăn người dùng từ Internet truy cập trực tiếp URL http://<IP>/404.html
    location = /404.html {
        root /var/www/my-web/html;
        internal;
    }
}
